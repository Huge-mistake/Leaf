name: Build Leaf 26.3

on:
  push:
    branches: [ "ver/26.3" ]
  workflow_dispatch:

jobs:
  build:
    # Run workflow only on main repo
    if: ${{ github.repository == 'Huge-mistake/Leaf' }}
    runs-on: ubuntu-latest
    env:
      MC_VERSION: "26.3"
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: gradle

      - name: Configure Git
        run: |
          git config --global user.email "no-reply@github.com"
          git config --global user.name "Github Actions"

      - name: Apply patches
        run: ./gradlew applyAllPatches --stacktrace --no-daemon
      - name: Create LeafclipJar
        run: ./gradlew createLeafclipJar --stacktrace --no-daemon

      - name: Prepare release notes and artifacts
        run: |
          chmod +x ./scripts/prepareRelease.sh
          ./scripts/prepareRelease.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          MC_VERSION: ${{ env.MC_VERSION }}
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}

      - name: Release Leaf
        uses: softprops/action-gh-release@v3
        with:
          name: "Leaf ${{ env.MC_VERSION }}"
          tag_name: "ver-${{ env.MC_VERSION }}"
          files: "./leaf-${{ env.MC_VERSION }}-${{ env.BUILD_NUMBER }}.jar"
          body_path: "./release_notes.md"
          token: "${{ secrets.GITHUB_TOKEN }}"
          target_commitish: "${{ github.sha }}"
          draft: false
          prerelease: false
