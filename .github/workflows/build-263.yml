name: Build Leaf 26.3

on:
  push:
    branches: [ "ver/26.3" ]
  workflow_dispatch:

jobs:
  build:
    # Run workflow only on main repo
    if: ${{ github.repository == 'Huge-mistake/Leaf' }}
    runs-on: ubuntu-latest
    env:
      MC_VERSION: "26.3"
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: gradle

      - name: Configure Git
        run: |
          git config --global user.email "no-reply@github.com"
          git config --global user.name "Github Actions"

      - name: Apply patches
        run: ./gradlew applyAllPatches --stacktrace --no-daemon
      - name: Create LeafclipJar
        run: ./gradlew createLeafclipJar --stacktrace --no-daemon

      - name: Locate jars
        run: find . -name "*.jar" -not -path "./.gradle/*" -not -path "./.git/*"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: leaf-${{ env.MC_VERSION }}-${{ env.BUILD_NUMBER }}
          path: |
            **/build/libs/*.jar
            *.jar
          if-no-files-found: error
